<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Lobster+Two:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="auth.css">
<title>Sign up · Stackly Skincare Clinic</title>
</head>
<body class="a-signup">
<main class="au-stage">
  <section class="au-hero">
    <a class="au-brand" href="index.html" aria-label="Stackly - back to home"><img src="Assests/logo.webp" alt="Stackly" width="352" height="92"></a>
    <h2>SIGN <span>UP</span></h2>
    <h3>FIND YOUR OWN WAY</h3>
    <p>Schedule your skin visits in just a few clicks. Create your account and get started today.</p>
  </section>

  <div class="au-side">
    <form class="au-card" id="authForm" data-mode="signup" novalidate>
      <h1>signup</h1>
      <div class="au-roles" role="radiogroup" aria-label="Create account as">
        <label><input type="radio" name="role" value="user" checked><span>Client</span></label>
        <label><input type="radio" name="role" value="admin"><span>Admin</span></label>
      </div>
      <div class="au-fld"><input type="text" name="name" placeholder="Full Name" aria-label="Full name" autocomplete="name"></div>
      <div class="au-fld"><input type="email" name="email" placeholder="Email Address" aria-label="Email address" autocomplete="email"></div>
      <div class="au-fld"><input type="password" name="pwd" placeholder="Password" aria-label="Password" autocomplete="new-password"><button type="button" class="au-eye">Show</button></div>
      <div class="au-fld"><input type="password" name="pwd2" placeholder="Confirm Password" aria-label="Confirm password" autocomplete="new-password"><button type="button" class="au-eye">Show</button></div>
      <p class="au-msg" id="msg" role="status" aria-live="polite"></p>
      <button class="au-btn" type="submit">Sign Up</button>
      <a class="au-back" href="index.html">← Back to Home</a>
      <p class="au-alt">Already registered? <a href="login.html">Login</a></p>
    </form>
  </div>
</main>
<script src="auth.js"></script>
</body>
</html>
