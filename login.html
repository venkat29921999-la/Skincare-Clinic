<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Lobster+Two:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="auth.css">
<title>Login · Stackly Skincare Clinic</title>
</head>
<body class="a-login">
<main class="au-stage">
  <a class="au-brand" href="index.html" aria-label="Stackly - back to home"><img src="Assests/logo.webp" alt="Stackly" width="352" height="92"></a>
  <img class="au-hands" src="Assests/login-hands.webp" alt="">

  <form class="au-card" id="authForm" data-mode="login" novalidate>
    <h1>Login to your account</h1>
    <div class="au-roles" role="radiogroup" aria-label="Sign in as">
        <label><input type="radio" name="role" value="user" checked><span>Client</span></label>
        <label><input type="radio" name="role" value="admin"><span>Admin</span></label>
      </div>

    <div class="au-grp">
      <div class="au-fld"><input type="email" name="email" placeholder="Email Address" aria-label="Email address" autocomplete="email"></div>
      <div class="au-fld"><input type="password" name="pwd" placeholder="Password" aria-label="Password" autocomplete="current-password"><button type="button" class="au-eye">Show</button></div>
      <div class="au-row">
        <label><input type="checkbox" name="remember"> Remember me</label>
        <a href="404.html" id="forgot">Forgot password</a>
      </div>
    </div>

    <div class="au-grp">
      <p class="au-msg" id="msg" role="status" aria-live="polite"></p>
      <button class="au-btn" type="submit">Log In</button>
      <a class="au-back" href="index.html">← Back to Home</a>
    </div>

    <div class="au-grp">
      <div class="au-or">Instant Login</div>
      <div class="au-social">
        <button type="button" class="au-soc" data-soc="Google" onclick="window.location.href='404.html'"><i>G</i>Continue with Google</button>
<button type="button" class="au-soc fb" data-soc="Facebook" onclick="window.location.href='404.html'"><i>f</i>Continue with Facebook</button>
</div>
    </div>

    <p class="au-alt">Don't have an account? <a href="signup.html">Sign up</a></p>
  </form>
</main>
<script src="auth.js"></script>
<script src="site-fx.js"></script>
</body>
</html>
